<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>miso-fetch — Typed HTTP requests from Haskell</title>
    <meta name="description" content="The browser Fetch API driven from Haskell compiled to WebAssembly: typed JSON requests against the live GitHub API, decoded into Haskell records with the miso framework.">
    <link rel="canonical" href="https://fetch.haskell-miso.org/">
    <meta name="theme-color" content="#0b1220">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://fetch.haskell-miso.org/">
    <meta property="og:title" content="miso-fetch — Typed HTTP requests from Haskell">
    <meta property="og:description" content="Fetch and decode live GitHub API data with typed Haskell, compiled to WebAssembly with miso.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="miso-fetch — Typed HTTP requests from Haskell">
    <meta name="twitter:description" content="Fetch and decode live GitHub API data with typed Haskell, compiled to WebAssembly with miso.">
    <link rel="icon" href="favicon.ico">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "miso-fetch",
      "url": "https://fetch.haskell-miso.org/",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web",
      "description": "The browser Fetch API driven from Haskell compiled to WebAssembly with the miso framework.",
      "codeRepository": "https://github.com/haskell-miso/miso-fetch"
    }
    </script>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #131c30;
        --panel-edge: #253352;
        --text: #e8ecf6;
        --muted: #93a0bd;
        --accent: #58a6ff;
        --accent-2: #7ee787;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f4f6fb;
          --panel: #ffffff;
          --panel-edge: #dfe5f2;
          --text: #17203a;
          --muted: #59647f;
          --accent: #0969da;
          --accent-2: #1a7f37;
          color-scheme: light;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      .app { max-width: 820px; margin: 0 auto; padding: 1.25rem; }
      .hero { text-align: center; padding: 2.25rem 0 1.5rem; }
      .hero h1 { margin: 0 0 .5rem; font-size: clamp(1.9rem, 5vw, 2.8rem); letter-spacing: -.02em; }
      .hero h1 a { color: var(--text); text-decoration: none; }
      .hero h1 a:hover { color: var(--accent); }
      .tagline { margin: 0 auto 1.1rem; max-width: 42rem; color: var(--muted); font-size: 1.05rem; }
      .tagline code, .foot code {
        font-family: ui-monospace, Menlo, monospace;
        font-size: .85em;
        background: var(--panel);
        border-radius: 6px;
        padding: .1em .35em;
      }
      .gh {
        display: inline-block;
        padding: .5rem 1.1rem;
        border: 1px solid var(--panel-edge);
        border-radius: 999px;
        background: var(--panel);
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
        font-size: .92rem;
        transition: border-color .15s ease, transform .15s ease;
      }
      .gh:hover { border-color: var(--accent); transform: translateY(-1px); }
      .panel {
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 16px;
        padding: 1.25rem;
      }
      .search { display: flex; gap: .6rem; margin-bottom: 1rem; }
      .search input {
        flex: 1;
        min-width: 0;
        padding: .65rem .9rem;
        border-radius: 10px;
        border: 1px solid var(--panel-edge);
        background: var(--bg);
        color: var(--text);
        font-size: 1rem;
        outline: none;
      }
      .search input:focus { border-color: var(--accent); }
      .btn {
        padding: .65rem 1.3rem;
        border-radius: 10px;
        border: 1px solid var(--panel-edge);
        background: var(--accent);
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn:hover { filter: brightness(1.1); }
      .error {
        background: rgba(248, 81, 73, .12);
        border: 1px solid rgba(248, 81, 73, .4);
        color: #f85149;
        border-radius: 10px;
        padding: .6rem .9rem;
        font-size: .95rem;
      }
      .user { display: flex; gap: 1rem; align-items: center; margin: 1.25rem 0; }
      .avatar {
        width: 84px; height: 84px;
        border-radius: 50%;
        border: 2px solid var(--panel-edge);
        flex-shrink: 0;
      }
      .user-info h2 { margin: 0; font-size: 1.3rem; }
      .user-info h2 a { color: var(--text); text-decoration: none; }
      .user-info h2 a:hover { color: var(--accent); }
      .login { margin-left: .5rem; color: var(--muted); font-weight: 400; font-size: .95rem; }
      .bio { margin: .25rem 0; color: var(--muted); font-size: .95rem; }
      .stats { margin: .25rem 0 0; color: var(--muted); font-size: .92rem; }
      .stats strong { color: var(--accent-2); }
      .repos-title { margin: 1.25rem 0 .75rem; font-size: 1.05rem; color: var(--muted); }
      .repos { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .75rem; }
      .repo {
        display: block;
        padding: .8rem .95rem;
        border: 1px solid var(--panel-edge);
        border-radius: 12px;
        background: var(--bg);
        text-decoration: none;
        color: var(--text);
        transition: border-color .15s ease, transform .15s ease;
      }
      .repo:hover { border-color: var(--accent); transform: translateY(-2px); }
      .repo h4 { margin: 0 0 .3rem; font-size: 1rem; color: var(--accent); }
      .repo .desc {
        margin: 0 0 .4rem;
        color: var(--muted);
        font-size: .85rem;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .repo .meta { margin: 0; color: var(--muted); font-size: .82rem; }
      .foot { text-align: center; color: var(--muted); font-size: .9rem; padding: 2rem 0 1rem; }
      .foot a { color: var(--accent); text-decoration: none; }
      .foot a:hover { text-decoration: underline; }
      body:has(> .app) .boot, body:has(> .stage) .boot { display: none; }
      .boot {
        min-height: 100vh;
        display: flex; flex-direction: column; gap: 1rem;
        align-items: center; justify-content: center;
        color: var(--muted);
      }
      .boot .spin {
        width: 42px; height: 42px;
        border-radius: 50%;
        border: 3px solid var(--panel-edge);
        border-top-color: var(--accent);
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (max-width: 560px) {
        .app { padding: .9rem; }
        .user { flex-direction: column; text-align: center; }
      }
    </style>
  </head>
  <body>
    <div class="boot">
      <div class="spin" aria-hidden="true"></div>
      <p>Loading Haskell WebAssembly&hellip;</p>
      <noscript>miso-fetch is an interactive WebAssembly demo and needs JavaScript enabled.</noscript>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
